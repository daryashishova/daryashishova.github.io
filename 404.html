<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>404</title><meta name="robots" content="noindex"><style>:root{--fg:#141414;--muted:#5d5d5d;--line:#141414;--accent:#c8102e;--bg:#fff;--soft:#f3f1ec;
--mono:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 var(--mono)}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.skip{position:absolute;left:-9999px}
.skip:focus{left:16px;top:8px;background:var(--bg);padding:4px 8px;z-index:9}
.top .bar{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;padding-top:14px;padding-bottom:14px}
.brand{font-weight:700;text-decoration:none;margin-right:auto}
.menu{order:3;width:100%;display:flex;flex-wrap:wrap;gap:2px 18px;font-size:14px}
.menu a{text-decoration:none}
.menu a[aria-current]{color:var(--accent)}
.lang{font-size:14px}
@media(min-width:900px){.menu{order:0;width:auto}}
h1{font-size:clamp(28px,5vw,46px);line-height:1.15;font-weight:400;margin:.35em 0 .3em}
h2{font-size:clamp(22px,3.4vw,30px);line-height:1.2;font-weight:400;margin:1.8em 0 .5em}
h2 a{text-decoration:none}
.lead{font-size:17px;max-width:62ch}
.text{max-width:62ch}
.muted{color:var(--muted)}
.crumbs{font-size:13px;color:var(--muted);margin:6px 0 0}
.crumbs a{color:inherit}
.hero{display:grid}
.hero-photo{margin:0 -16px}
.hero-photo img{width:100%;height:46svh;min-height:300px;object-fit:cover;object-position:50% 40%}
.hero-text{padding:22px 0 4px}
.hero h1{margin:0}
.role{color:var(--muted);margin:.4em 0 1.3em;font-size:17px}
.links{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
.links li{border-bottom:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;gap:12px;padding:14px 2px;text-decoration:none;font-size:17px}
.links a::after{content:"→";color:var(--accent)}
.contacts{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px}
@media(min-width:860px){
.hero{grid-template-columns:1fr minmax(320px,38%);min-height:calc(100svh - 60px)}
.hero-photo{order:2;margin:0}
.hero-photo img{height:100%;min-height:560px}
.hero-text{align-self:center;padding:24px 56px 24px 0}
}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 14px;margin:18px 0 8px}
@media(min-width:640px){.cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:28px 20px}}
.card a{display:block;text-decoration:none}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--soft)}
.card.free img{aspect-ratio:auto;object-fit:contain}
.card h3{font-size:16px;font-weight:700;margin:10px 0 2px}
.card p{margin:0;font-size:14px;color:var(--muted)}
.gallery{columns:1;column-gap:24px;margin:28px 0}
@media(min-width:640px){.gallery{columns:2}}
@media(min-width:1100px){.gallery{columns:3}}
.gallery figure{break-inside:avoid;margin:0 0 28px}
.gallery a{display:block}
figcaption{font-size:13px;color:var(--muted);margin-top:6px}
.poem{margin:24px 0;padding-left:16px;border-left:2px solid var(--accent)}
.poem p{margin:0}
blockquote{margin:32px 0;padding-left:16px;border-left:2px solid var(--accent);max-width:62ch}
.more{list-style:none;padding:0;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px 20px}
.about{display:grid;gap:24px;align-items:start}
@media(min-width:860px){.about{grid-template-columns:420px 1fr;gap:48px}}
.foot{margin-top:64px;padding-bottom:36px;font-size:14px}
.foot>div{border-top:1px solid var(--line);padding-top:18px}
.foot .contacts{margin:0 0 8px}</style></head>
<body><main class="wrap"><h1>404</h1>
<p>Такой страницы нет. <a href="/">На главную</a></p>
<p lang="en">Page not found. <a href="/en/">Home</a></p></main></body></html>
